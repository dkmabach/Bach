<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Price</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        color: #222;
      }

      h1 {
        margin-bottom: 12px;
      }

      .table-wrap {
        margin-top: 20px;
        overflow-x: auto;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 900px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      th,
      td {
        border: 1px solid #d9d9d9;
        padding: 10px 12px;
        text-align: left;
      }

      th {
        background: #f3f6fb;
      }

      .status {
        margin: 10px 0 16px;
        color: #444;
        min-height: 24px;
      }

      .price-low {
        color: #0a7c42;
        font-weight: bold;
      }

      .price-high {
        color: #b42318;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Power Price</h1>
    <p>This is the Power Price page.</p>
    <p>
      <a href="https://www.elprisenligenu.dk"
        ><img
          src="https://i.bnfcl.io/hva-koster-strommen/elpriser-leveret-af-elprisenligenu_LJNbbujZAX.png"
          alt="Elpriser leveret af Elprisen lige nu.dk"
          width="200"
          height="45"
      /></a>
    </p>

    <div class="status" id="status">Loading electricity prices…</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Hour</th>
            <th id="todayHeader">Today</th>
            <th id="tomorrowHeader">Tomorrow</th>
          </tr>
        </thead>
        <tbody id="priceTableBody"></tbody>
      </table>
    </div>

    <p><a href="index.html">Back to home</a></p>

    <script>
      const rssUrl = "https://www.elprisenligenu.dk/rss/prices/DK1";
      const todayHeader = document.getElementById("todayHeader");
      const tomorrowHeader = document.getElementById("tomorrowHeader");
      const tableBody = document.getElementById("priceTableBody");
      const statusText = document.getElementById("status");

      function formatPrice(value) {
        if (value === null || value === undefined || Number.isNaN(value)) {
          return "-";
        }
        return `${value.toFixed(2)} kr/kWh`;
      }

      function formatHourRange(hour) {
        const start = String(hour).padStart(2, "0");
        const end = String((hour + 1) % 24).padStart(2, "0");
        return `${start}:00-${end}:00`;
      }

      function parsePriceValue(rawText) {
        if (!rawText) return null;
        const match = String(rawText).match(/(\d+(?:[.,]\d+)?)/);
        if (!match) return null;
        return Number(match[1].replace(",", "."));
      }

      function extractDateAndHour(text) {
        if (!text) return null;

        const directMatch = text.match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}):00-(\d{2}):00/i);
        if (directMatch) {
          return {
            date: directMatch[1],
            hour: Number(directMatch[2])
          };
        }

        const simpleMatch = text.match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}):\d{2}/i);
        if (simpleMatch) {
          return {
            date: simpleMatch[1],
            hour: Number(simpleMatch[2])
          };
        }

        return null;
      }

      function buildTable(dataMap, firstDate, secondDate) {
        const rows = [];

        for (let hour = 0; hour < 24; hour++) {
          const todayValue = dataMap.get(firstDate)?.[hour] ?? null;
          const tomorrowValue = dataMap.get(secondDate)?.[hour] ?? null;

          const todayCell = todayValue === null
            ? "-"
            : `<span class="${todayValue < 1 ? "price-low" : "price-high"}">${formatPrice(todayValue)}</span>`;

          const tomorrowCell = tomorrowValue === null
            ? "-"
            : `<span class="${tomorrowValue < 1 ? "price-low" : "price-high"}">${formatPrice(tomorrowValue)}</span>`;

          rows.push(`
            <tr>
              <td>${formatHourRange(hour)}</td>
              <td>${todayCell}</td>
              <td>${tomorrowCell}</td>
            </tr>
          `);
        }

        tableBody.innerHTML = rows.join("");
      }

      async function loadPrices() {
        try {
          const response = await fetch(rssUrl);
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const xmlText = await response.text();
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlText, "application/xml");

          const parseErrors = xmlDoc.querySelector("parsererror");
          if (parseErrors) {
            throw new Error("The electricity price feed could not be parsed.");
          }

          const items = Array.from(xmlDoc.querySelectorAll("item"));
          const prices = [];

          items.forEach((item) => {
            const title = item.querySelector("title")?.textContent || "";
            const description = item.querySelector("description")?.textContent || "";
            const priceText = parsePriceValue(description) ?? parsePriceValue(title);
            const dateInfo = extractDateAndHour(title) || extractDateAndHour(description);

            if (dateInfo && priceText !== null) {
              prices.push({
                date: dateInfo.date,
                hour: dateInfo.hour,
                price: priceText
              });
            }
          });

          if (prices.length === 0) {
            throw new Error("No electricity price data was found in the feed.");
          }

          const sortedDates = [...new Set(prices.map((entry) => entry.date))].sort();
          const firstDate = sortedDates[0];
          const secondDate = sortedDates[1] || firstDate;

          const dataMap = new Map();
          prices.forEach((entry) => {
            if (!dataMap.has(entry.date)) {
              dataMap.set(entry.date, {});
            }
            dataMap.get(entry.date)[entry.hour] = entry.price;
          });

          const dateLabel1 = new Date(`${firstDate}T00:00:00`).toLocaleDateString(undefined, {
            weekday: "short",
            month: "short",
            day: "numeric"
          });

          const dateLabel2 = new Date(`${secondDate}T00:00:00`).toLocaleDateString(undefined, {
            weekday: "short",
            month: "short",
            day: "numeric"
          });

          todayHeader.textContent = dateLabel1;
          tomorrowHeader.textContent = dateLabel2;
          buildTable(dataMap, firstDate, secondDate);
          statusText.textContent = "Electricity prices loaded successfully.";
        } catch (error) {
          console.error(error);
          statusText.textContent = "Could not load electricity prices. Please try again later.";
          tableBody.innerHTML = "<tr><td colspan='3'>No data available.</td></tr>";
        }
      }

      loadPrices();
    </script>
  </body>
</html>
