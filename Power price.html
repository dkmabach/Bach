<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Price</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        color: #222;
      }

      h1 {
        margin-bottom: 12px;
      }

      .table-wrap {
        margin-top: 20px;
        overflow-x: auto;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 900px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      th,
      td {
        border: 1px solid #d9d9d9;
        padding: 10px 12px;
        text-align: left;
      }

      th {
        background: #f3f6fb;
      }

      .status {
        margin: 10px 0 16px;
        color: #444;
        min-height: 24px;
      }

      .price-low {
        color: #0a7c42;
        font-weight: bold;
      }

      .price-high {
        color: #b42318;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Power Price</h1>
    <p>This is the Power Price page.</p>
    <p>
      <a href="https://www.elprisenligenu.dk">
        <img
          src="https://i.bnfcl.io/hva-koster-strommen/elpriser-leveret-af-elprisenligenu_LJNbbujZAX.png"
          alt="Elpriser leveret af Elprisen lige nu.dk"
          width="200"
          height="45"
        />
      </a>
    </p>

    <div class="status" id="status">Loading electricity prices…</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Hour</th>
            <th id="todayHeader">Today</th>
            <th id="tomorrowHeader">Tomorrow</th>
          </tr>
        </thead>
        <tbody id="priceTableBody"></tbody>
      </table>
    </div>

    <p><a href="index.html">Back to home</a></p>

    <script>
      function buildApiUrlForDate(date, area = "DK1") {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `https://www.elprisenligenu.dk/api/v1/prices/${year}/${month}-${day}_${area}.json`;
      }

      function formatPrice(value) {
        if (value === null || value === undefined || Number.isNaN(value)) return "-";
        return `${value.toFixed(2)} kr/kWh`;
      }

      function formatHourRange(hour) {
        const start = String(hour).padStart(2, "0");
        const end = String((hour + 1) % 24).padStart(2, "0");
        return `${start}:00-${end}:00`;
      }

      function buildTable(dataMap, firstDate, secondDate) {
        const rows = [];

        for (let hour = 0; hour < 24; hour++) {
          const todayValue = dataMap.get(firstDate)?.[hour] ?? null;
          const tomorrowValue = dataMap.get(secondDate)?.[hour] ?? null;

          const todayCell =
            todayValue === null
              ? "-"
              : `<span class="${todayValue < 1 ? "price-low" : "price-high"}">${formatPrice(todayValue)}</span>`;

          const tomorrowCell =
            tomorrowValue === null
              ? "-"
              : `<span class="${tomorrowValue < 1 ? "price-low" : "price-high"}">${formatPrice(tomorrowValue)}</span>`;

          rows.push(`
            <tr>
              <td>${formatHourRange(hour)}</td>
              <td>${todayCell}</td>
              <td>${tomorrowCell}</td>
            </tr>
          `);
        }

        document.getElementById("priceTableBody").innerHTML = rows.join("");
      }

      function getHourFromTime(timeString) {
        const date = new Date(timeString);
        return date.getHours();
      }

      async function loadPrices() {
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);

        const todayUrl = buildApiUrlForDate(today, "DK1");
        const tomorrowUrl = buildApiUrlForDate(tomorrow, "DK1");

        try {
          const [todayResponse, tomorrowResponse] = await Promise.all([
            fetch(todayUrl),
            fetch(tomorrowUrl)
          ]);

          if (!todayResponse.ok) {
            throw new Error(`Could not load today's prices (${todayResponse.status})`);
          }

          const todayData = await todayResponse.json();
          const tomorrowData = tomorrowResponse.ok ? await tomorrowResponse.json() : [];

          const dataMap = new Map();

          function addEntries(date, entries) {
            const dateKey = date.toISOString().slice(0, 10);
            const map = {};

            entries.forEach((entry) => {
              const hour = getHourFromTime(entry.time_start);
              map[hour] = Number(entry.DKK_per_kWh);
            });

            dataMap.set(dateKey, map);
          }

          addEntries(today, todayData);
          addEntries(tomorrow, tomorrowData);

          const firstDate = today.toISOString().slice(0, 10);
          const secondDate = tomorrow.toISOString().slice(0, 10);

          document.getElementById("todayHeader").textContent = today.toLocaleDateString(undefined, {
            weekday: "short",
            month: "short",
            day: "numeric"
          });

          document.getElementById("tomorrowHeader").textContent = tomorrow.toLocaleDateString(undefined, {
            weekday: "short",
            month: "short",
            day: "numeric"
          });

          buildTable(dataMap, firstDate, secondDate);
          document.getElementById("status").textContent = "Electricity prices loaded successfully.";
        } catch (error) {
          console.error(error);
          document.getElementById("status").textContent = "Could not load electricity prices. Please try again later.";
          document.getElementById("priceTableBody").innerHTML = "<tr><td colspan='3'>No data available.</td></tr>";
        }
      }

      loadPrices();
    </script>
  </body>
</html>
